<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Associação PQ Vila Nova - CRM</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* === RESET E FONTES === */
        * { box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: #eef2f5; margin: 0; padding: 30px; color: #333; }

        /* === TELA DE LOGIN === */
        #login-screen { max-width: 400px; margin: 100px auto; background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
        #login-screen h2 { color: #4a7c2e; margin-bottom: 10px; font-weight: 700; letter-spacing: -0.5px; }
        #login-screen p { color: #777; margin-bottom: 30px; }
        .input-group { margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #7baa48; box-shadow: 0 0 0 3px rgba(123, 170, 72, 0.2); }
        .btn-primary { width: 100%; background-color: #7baa48; color: #fff; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .btn-primary:hover { background-color: #629035; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(123, 170, 72, 0.3); }
        #login-error { color: #e74c3c; font-size: 14px; margin-top: 10px; display: none; }

        /* === DASHBOARD (HOME) === */
        #dashboard-screen { display: none; max-width: 1400px; margin: 0 auto; }
        .header { display: flex; justify-content: center; align-items: center; margin-bottom: 40px; gap: 15px; }
        .header h1 { font-size: 34px; font-weight: 800; color: #2c3e50; letter-spacing: 1px; margin: 0; position: relative; }
        .header h1 span { color: #4a7c2e; }
        .header::after { content: ''; flex: 1; height: 2px; background: linear-gradient(to right, #eef2f5, #7baa48, #eef2f5); }

        /* === GRID DAS COLUNAS === */
        .grid-container { display: grid; grid-template-columns: 1.1fr 1.8fr 1.1fr; gap: 25px; align-items: start; }

        /* === ESTILOS DOS PAINÉIS (AGENDA E CARTÕES) === */
        .panel { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.04); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .panel-header h3 { margin: 0; font-size: 14px; color: #fff; background: #7baa48; padding: 8px 16px; border-radius: 20px; font-weight: 600; }
        .btn-sm { background: transparent; border: 1px solid #4a7c2e; color: #4a7c2e; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-sm:hover { background: #4a7c2e; color: #fff; }

        /* === TABELA DA AGENDA === */
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        table thead { background: #1a1a1a; color: #fff; }
        table th, table td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #eee; }
        table th { font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        .highlight-row { background-color: #eafde8; border-left: 4px solid #7baa48; font-weight: 700; }

        /* === COLUNA CENTRAL === */
        .col-center { display: flex; flex-direction: column; align-items: center; padding-top: 10px; }
        .logo-circle { width: 180px; height: 180px; border-radius: 50%; border: 4px solid #4a7c2e; background: #fff; margin-bottom: 30px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #4a7c2e; font-weight: 600; text-align: center; background-image: url('https://via.placeholder.com/180x180?text=Logo+Associação'); background-size: cover; padding: 10px; }
        .menu-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; max-width: 450px; width: 100%; }
        .btn-action { background: #7baa48; color: #fff; border: none; border-radius: 8px; padding: 15px 0; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-transform: uppercase; letter-spacing: 1px;}
        .btn-action:hover { background: #629035; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-action:nth-child(1) { grid-column: 1; } .btn-action:nth-child(2) { grid-column: 3; }
        .btn-action:nth-child(3) { grid-column: 1; } .btn-action:nth-child(4) { grid-column: 2; }
        .btn-action:nth-child(5) { grid-column: 3; } .btn-action:nth-child(6) { grid-column: 1; }
        .btn-action:nth-child(7) { grid-column: 2; } .btn-action:nth-child(8) { grid-column: 3; }

        /* === TABELA DE CARTÕES === */
        .table-cards th { background: #4a7c2e; color: #fff; }
        .total-geral { margin-top: 15px; border-top: 2px solid #7baa48; padding-top: 10px; display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; }

        /* === MODAIS (POP-UPS) === */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #fff; padding: 30px; border-radius: 16px; width: 100%; max-width: 450px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); position: relative; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-box h3 { margin: 0 0 15px 0; color: #4a7c2e; font-weight: 700; text-align: center; }
        .modal-box label { display: block; margin: 10px 0 5px; font-weight: 600; font-size: 14px; color: #444; }
        .modal-box input, .modal-box select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 10px; outline: none; }
        .modal-box input:focus, .modal-box select:focus { border-color: #7baa48; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
        .modal-actions .btn-primary { width: auto; padding: 10px 20px; font-size: 14px; }
        .btn-cancel { background: #e0e0e0; color: #333; padding: 10px 20px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
        .btn-cancel:hover { background: #ccc; }
        .close-btn { position: absolute; right: 15px; top: 15px; cursor: pointer; font-size: 20px; color: #aaa; }
        .close-btn:hover { color: #333; }

        /* === RESPONSIVO === */
        @media (max-width: 900px) {
            .grid-container { grid-template-columns: 1fr; }
            .col-center { order: -1; }
            .menu-buttons { grid-template-columns: 1fr 1fr !important; }
            .btn-action { grid-column: auto !important; }
            .header { flex-direction: column; text-align: center; }
            .header::after { display: none; }
        }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="login-screen">
        <h2>Acesso ao Sistema</h2>
        <p>Associação PQ Vila Nova</p>
        <div class="input-group"><input type="text" id="username" placeholder="Usuário"></div>
        <div class="input-group"><input type="password" id="password" placeholder="Senha" onkeydown="if(event.key==='Enter') login()"></div>
        <button class="btn-primary" onclick="login()">Entrar</button>
        <div id="login-error">Usuário ou senha incorretos</div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard-screen">
        <div class="header">
            <h1>ASSOCIAÇÃO <span>PQ VILA NOVA</span></h1>
        </div>

        <div class="grid-container">
            <!-- COLUNA ESQUERDA: AGENDA -->
            <div class="panel">
                <div class="panel-header">
                    <h3>AGENDA QUADRA</h3>
                    <button class="btn-sm" onclick="abrirModal('modal-agenda')">+ Adicionar Data</button>
                </div>
                <table>
                    <thead><tr><th>DATA</th><th>HORÁRIO</th><th>NOME</th><th>END</th><th>TEL</th></tr></thead>
                    <tbody id="agenda-list"></tbody>
                </table>
            </div>

            <!-- COLUNA CENTRAL: BOTÕES -->
            <div class="col-center">
                <div class="logo-circle">Logotipo da Associação</div>
                <div class="menu-buttons">
                    <button class="btn-action">CURRICULO</button>
                    <button class="btn-action">WHATSAPP</button>
                    <button class="btn-action">SEM ASSINATURA</button>
                    <button class="btn-action">COMPROVANTE</button>
                    <button class="btn-action">ENTREGAS</button>
                    <button class="btn-action">CARTEIRINHAS</button>
                    <button class="btn-action">COMPRA E VENDA</button>
                    <button class="btn-action">CESTAS</button>
                </div>
            </div>

            <!-- COLUNA DIREITA: CARTÕES -->
            <div class="panel">
                <div class="panel-header">
                    <h3>CARTÕES</h3>
                    <button class="btn-sm" onclick="abrirModal('modal-cartoes')">+ Adicionar</button>
                </div>
                <table class="table-cards">
                    <thead><tr><th>DATA</th><th>CEZAR</th><th>WALTER</th><th>TOTAL DIA</th></tr></thead>
                    <tbody id="cards-list"></tbody>
                </table>
                <div class="total-geral">
                    <span>Total Cezar: <span id="total-cezar">0</span></span>
                    <span>Total Walter: <span id="total-walter">0</span></span>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAIS (POP-UPS) -->
    <!-- 1. Modal de Adicionar na Agenda -->
    <div id="modal-agenda" class="modal-overlay">
        <div class="modal-box">
            <span class="close-btn" onclick="fecharModal('modal-agenda')">×</span>
            <h3>Novo Agendamento</h3>
            <label>Nome do Responsável</label>
            <input type="text" id="ag-nome" placeholder="Ex: João Silva">
            <label>Data</label>
            <input type="date" id="ag-data">
            <label>Período / Horário</label>
            <input type="text" id="ag-periodo" placeholder="Ex: Manhã ou 14:00">
            <label>Endereço (Quadra)</label>
            <input type="text" id="ag-end" placeholder="Ex: Quadra 12">
            <label>Telefone</label>
            <input type="text" id="ag-tel" placeholder="(xx) xxxx-xxxx">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="fecharModal('modal-agenda')">Cancelar</button>
                <button class="btn-primary" onclick="salvarAgenda()">Salvar</button>
            </div>
        </div>
    </div>

    <!-- 2. Modal de Adicionar Cartões -->
    <div id="modal-cartoes" class="modal-overlay">
        <div class="modal-box">
            <span class="close-btn" onclick="fecharModal('modal-cartoes')">×</span>
            <h3>Adicionar Lote de Cartões</h3>
            <label>Responsável</label>
            <select id="card-responsavel">
                <option value="cezar">Cezar</option>
                <option value="walter">Walter</option>
            </select>
            <label>Quantidade</label>
            <input type="number" id="card-qtd" placeholder="0" min="1">
            <label>Data de Entrega</label>
            <input type="date" id="card-data">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="fecharModal('modal-cartoes')">Cancelar</button>
                <button class="btn-primary" onclick="salvarCartoes()">Salvar</button>
            </div>
        </div>
    </div>

    <!-- 3. Pop-up Automático de Login (Agenda do Dia) -->
    <div id="modal-popup-login" class="modal-overlay">
        <div class="modal-box">
            <span class="close-btn" onclick="fecharModal('modal-popup-login')">×</span>
            <h3>📅 Lembrete de Agenda</h3>
            <div id="popup-login-content" style="font-size: 14px; line-height: 1.6;">
                <!-- Conteúdo gerado pelo JS -->
            </div>
            <div class="modal-actions" style="justify-content: center;">
                <button class="btn-primary" onclick="fecharModal('modal-popup-login')">Ok, entendi</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT DO CRM -->
    <script>
        // --- BASE DE DADOS (Temporária, pois vamos linkar com a planilha depois) ---
        let dadosAgenda = [
            { id: 1, nome: "João Silva", data: "2026-08-05", periodo: "Manhã", endereco: "Qd 12", telefone: "99999-9999" },
            { id: 2, nome: "Maria Oliveira", data: "2026-08-15", periodo: "Tarde", endereco: "Qd 08", telefone: "98888-8888" }
        ];

        let dadosCartoes = [
            { id: 1, responsavel: 'cezar', qtd: 30, data: '2026-08-03' },
            { id: 2, responsavel: 'walter', qtd: 34, data: '2026-08-08' },
            { id: 3, responsavel: 'cezar', qtd: 18, data: '2026-08-28' },
            { id: 4, responsavel: 'walter', qtd: 25, data: '2026-08-28' }
        ];

        let idCounterAgenda = 3;
        let idCounterCartoes = 5;

        // --- FUNÇÃO DE LOGIN ---
        function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorBox = document.getElementById('login-error');
            errorBox.style.display = 'none';

            // Login Fake para testes
            if(user === 'admin' && pass === '123') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard-screen').style.display = 'block';
                renderizarTabelas();
                verificarProximaAgendaPopup();
            } else {
                errorBox.style.display = 'block';
            }
        }

        // --- LÓGICA DO POP-UP DE LOGIN ---
        function verificarProximaAgendaPopup() {
            const hoje = new Date();
            const proximos = dadosAgenda
                .map(item => ({ ...item, dataObj: new Date(item.data + 'T00:00:00') }))
                .filter(item => item.dataObj >= hoje)
                .sort((a, b) => a.dataObj - b.dataObj)
                .slice(0, 2); // Pega os 2 primeiros

            if (proximos.length > 0) {
                const content = document.getElementById('popup-login-content');
                let html = `<p><strong>Você tem os seguintes compromissos agendados:</strong></p><ul>`;
                proximos.forEach(item => {
                    const dataFormatada = new Date(item.data + 'T00:00:00').toLocaleDateString('pt-BR');
                    html += `<li><strong>${dataFormatada}</strong> - ${item.nome} (${item.periodo}) - Quadra ${item.endereco}</li>`;
                });
                html += `</ul>`;
                content.innerHTML = html;
                abrirModal('modal-popup-login');
            }
        }

        // --- RENDERIZAÇÃO DAS TABELAS ---
        function renderizarTabelas() {
            renderizarAgenda();
            renderizarCartoes();
        }

        function renderizarAgenda() {
            const tbody = document.getElementById('agenda-list');
            const hoje = new Date();
            tbody.innerHTML = '';

            // Ordenar por data
            const sorted = [...dadosAgenda].sort((a,b) => new Date(a.data) - new Date(b.data));
            
            let encontrouProximo = false;
            sorted.forEach(item => {
                const tr = document.createElement('tr');
                const dataItem = new Date(item.data + 'T00:00:00');
                const dataFormatada = dataItem.toLocaleDateString('pt-BR');

                // Destacar o próximo
                if (!encontrouProximo && dataItem >= hoje) {
                    tr.className = 'highlight-row';
                    encontrouProximo = true;
                }

                tr.innerHTML = `
                    <td>${dataFormatada}</td>
                    <td>${item.periodo}</td>
                    <td style="font-weight:600;">${item.nome}</td>
                    <td>${item.endereco}</td>
                    <td>${item.telefone}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderizarCartoes() {
            const tbody = document.getElementById('cards-list');
            tbody.innerHTML = '';

            let totalCezar = 0, totalWalter = 0;

            // Ordenar por data para exibição
            const sorted = [...dadosCartoes].sort((a,b) => new Date(a.data) - new Date(b.data));

            // Calcular totais por dia e por pessoa
            const agrupadoPorData = {};
            sorted.forEach(item => {
                if(!agrupadoPorData[item.data]) agrupadoPorData[item.data] = { cezar: 0, walter: 0 };
                if(item.responsavel === 'cezar') { agrupadoPorData[item.data].cezar += item.qtd; totalCezar += item.qtd; }
                if(item.responsavel === 'walter') { agrupadoPorData[item.data].walter += item.qtd; totalWalter += item.qtd; }
            });

            // Gerar linhas da tabela
            for (const [data, valores] of Object.entries(agrupadoPorData).sort((a,b) => new Date(a[0]) - new Date(b[0]))) {
                const tr = document.createElement('tr');
                const dataFormatada = new Date(data + 'T00:00:00').toLocaleDateString('pt-BR');
                const totalDia = valores.cezar + valores.walter;
                tr.innerHTML = `
                    <td>${dataFormatada}</td>
                    <td><strong>${valores.cezar > 0 ? valores.cezar : '-'}</strong></td>
                    <td><strong>${valores.walter > 0 ? valores.walter : '-'}</strong></td>
                    <td style="color:#4a7c2e; font-weight:700;">${totalDia}</td>
                `;
                tbody.appendChild(tr);
            }

            // Atualizar totais gerais
            document.getElementById('total-cezar').innerText = totalCezar;
            document.getElementById('total-walter').innerText = totalWalter;
        }

        // --- FUNÇÕES DE SALVAR NOVOS DADOS (Front-end) ---
        function salvarAgenda() {
            const nome = document.getElementById('ag-nome').value;
            const data = document.getElementById('ag-data').value;
            const periodo = document.getElementById('ag-periodo').value;
            const endereco = document.getElementById('ag-end').value;
            const telefone = document.getElementById('ag-tel').value;

            if(!nome || !data) { alert("Preencha pelo menos o Nome e a Data."); return; }

            dadosAgenda.push({ id: idCounterAgenda++, nome, data, periodo, endereco, telefone });
            fecharModal('modal-agenda');
            renderizarAgenda();
            
            // Limpar campos do modal
            document.getElementById('ag-nome').value = '';
            document.getElementById('ag-data').value = '';
            document.getElementById('ag-periodo').value = '';
            document.getElementById('ag-end').value = '';
            document.getElementById('ag-tel').value = '';
        }

        function salvarCartoes() {
            const responsavel = document.getElementById('card-responsavel').value;
            const qtd = parseInt(document.getElementById('card-qtd').value);
            const data = document.getElementById('card-data').value;

            if(!qtd || !data) { alert("Preencha a Quantidade e a Data."); return; }

            dadosCartoes.push({ id: idCounterCartoes++, responsavel, qtd, data });
            fecharModal('modal-cartoes');
            renderizarCartoes();

            document.getElementById('card-qtd').value = '';
            document.getElementById('card-data').value = '';
        }

        // --- CONTROLE DE MODAIS ---
        function abrirModal(id) {
            document.getElementById(id).classList.add('active');
        }
        function fecharModal(id) {
            document.getElementById(id).classList.remove('active');
        }
        // Fechar modal clicando fora
        document.querySelectorAll('.modal-overlay').forEach(el => {
            el.addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('active');
            });
        });
    </script>
</body>
</html>
