<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Associação PQ Vila Nova</title>
    <!-- CSS ESTRUTURAL DO CRM -->
    <style>
        /* Estilos globais */
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; color: #333; }
        
        /* Tela de Login */
        #login-screen { max-width: 350px; margin: 100px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); text-align: center; }
        #login-screen h2 { color: #3e7d25; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn-login { width: 100%; background-color: #7baa48; color: #fff; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-login:hover { background-color: #629036; }
        #login-error { color: #e74c3c; font-size: 14px; margin-top: 10px; display: none; }

        /* Dashboard Principal */
        #dashboard-screen { display: none; max-width: 1400px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { color: #3e7d25; font-size: 32px; letter-spacing: 2px; margin: 0; }

        /* Grid de 3 Colunas (Espelhando sua planilha) */
        .grid-container { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 20px; }
        
        /* Coluna 1 - Agenda */
        .col-left { background: #fff; border-radius: 8px; padding: 10px; box-shadow: 0 3px 10px rgba(0,0,0,0.05); }
        .col-left h3 { background: #7baa48; color: #fff; margin: -10px -10px 15px -10px; padding: 10px; border-radius: 8px 8px 0 0; font-size: 14px; }
        .table-agenda { width: 100%; border-collapse: collapse; font-size: 12px; }
        .table-agenda th { background: #000; color: #fff; padding: 8px; text-align: left; }
        .table-agenda td { border-bottom: 1px solid #eee; padding: 8px 6px; }

        /* Coluna 2 - Botões Centrais */
        .col-center { display: flex; flex-direction: column; align-items: center; }
        .logo-circle { width: 180px; height: 180px; border-radius: 50%; border: 4px solid #7baa48; background: #fff; margin-bottom: 30px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #3e7d25; font-weight: bold; background-image: url('https://via.placeholder.com/180x180?text=Logo+Assoc'); background-size: cover; }
        
        .menu-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; max-width: 450px; width: 100%; }
        .btn-action { background: #7baa48; color: #fff; border: none; border-radius: 8px; padding: 15px 0; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 3px 5px rgba(0,0,0,0.1); text-transform: uppercase; }
        .btn-action:hover { background: #5c8236; transform: translateY(-2px); }
        
        /* Posicionamento específico dos botões (para ficar igual sua imagem) */
        .btn-action:nth-child(1) { grid-column: 1; }
        .btn-action:nth-child(2) { grid-column: 3; }
        .btn-action:nth-child(3) { grid-column: 1; }
        .btn-action:nth-child(4) { grid-column: 2; }
        .btn-action:nth-child(5) { grid-column: 3; }
        .btn-action:nth-child(6) { grid-column: 1; }
        .btn-action:nth-child(7) { grid-column: 2; }
        .btn-action:nth-child(8) { grid-column: 3; }

        /* Coluna 3 - Cartões */
        .col-right { background: #fff; border-radius: 8px; padding: 10px; box-shadow: 0 3px 10px rgba(0,0,0,0.05); }
        .col-right h3 { background: #7baa48; color: #fff; margin: -10px -10px 15px -10px; padding: 10px; border-radius: 8px 8px 0 0; text-align: right; font-size: 14px; }
        .table-cards { width: 100%; border-collapse: collapse; font-size: 14px; }
        .table-cards th { background: #7baa48; color: #fff; padding: 8px; text-align: left; }
        .table-cards td { border-bottom: 1px solid #eee; padding: 8px; }

        /* Responsividade */
        @media (max-width: 900px) {
            .grid-container { grid-template-columns: 1fr; }
            .col-center { order: -1; margin-bottom: 20px; }
            .menu-buttons { grid-template-columns: 1fr 1fr !important; }
            .btn-action { grid-column: auto !important; }
        }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen">
        <h2>Controle de Acesso</h2>
        <div class="input-group"><input type="text" id="username" placeholder="Usuário"></div>
        <div class="input-group"><input type="password" id="password" placeholder="Senha" onkeydown="if(event.key==='Enter') login()"></div>
        <button class="btn-login" onclick="login()">Acessar o Sistema</button>
        <div id="login-error">Usuário ou senha incorretos</div>
    </div>

    <!-- DASHBOARD DO CRM -->
    <div id="dashboard-screen">
        <div class="header">
            <h1>ASSOCIAÇÃO DE MORADORES</h1>
        </div>
        <div class="grid-container">
            <!-- Esquerda: Agenda -->
            <div class="col-left">
                <h3>AGENDA QUADRA</h3>
                <table class="table-agenda">
                    <thead><tr><th>DATA</th><th>END</th><th>NOME</th><th>MOTIVO</th><th>SERVIÇO</th></tr></thead>
                    <tbody id="agenda-list">
                        <tr><td colspan="5" style="text-align:center;">Carregando agenda...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Centro: Botões -->
            <div class="col-center">
                <div class="logo-circle"></div>
                <div class="menu-buttons">
                    <button class="btn-action" onclick="abrirModule('curriculo')">CURRICULO</button>
                    <button class="btn-action" onclick="abrirModule('whatsapp')">WHATSAPP</button>
                    <button class="btn-action" onclick="abrirModule('sem_assinatura')">SEM ASSINATURA</button>
                    <button class="btn-action" onclick="abrirModule('comprovante')">COMPROVANTE</button>
                    <button class="btn-action" onclick="abrirModule('entregas')">ENTREGAS</button>
                    <button class="btn-action" onclick="abrirModule('carteirinhas')">CARTEIRINHAS</button>
                    <button class="btn-action" onclick="abrirModule('compra_venda')">COMPRA E VENDA</button>
                    <button class="btn-action" onclick="abrirModule('cestas')">CESTAS</button>
                </div>
            </div>

            <!-- Direita: Cartões -->
            <div class="col-right">
                <h3>CARTÕES</h3>
                <table class="table-cards">
                    <thead><tr><th>QT</th><th>DATA</th></tr></thead>
                    <tbody id="cards-list">
                        <tr><td colspan="2" style="text-align:center;">Carregando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT DO CRM -->
    <script>
        // URL DO WEB APP DO APPS SCRIPT (SERÁ USADO DEPOIS)
        const URL_API = ""; // Deixe vazio por enquanto

        // ------------------ LOGIN (FAKE POR ENQUANTO) ------------------
        function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorBox = document.getElementById('login-error');
            errorBox.style.display = 'none';

            // Use uma validação simples local para testes iniciais
            if(user === 'admin' && pass === '123') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard-screen').style.display = 'block';
                carregarDadosIniciais(); // Chama os dados quando logar
            } else {
                errorBox.style.display = 'block';
            }
        }

        // ------------------ FUNÇÕES DE INTEGRAÇÃO (PRONTAS PARA LINKAR) ------------------
        
        async function carregarDadosIniciais() {
            // **AQUI É ONDE VOCÊ VAI CONECTAR SEU APP SCRIPT**
            /* Exemplo futuro:
               const resposta = await fetch(URL_API + '?action=buscarAgenda');
               const dados = await resposta.json();
               // Renderizar dados...
            */
            
            // Por enquanto, uso dados falsos para você ver o visual funcionando
            setTimeout(() => {
                document.getElementById('agenda-list').innerHTML = `
                    <tr><td>03/08</td><td>Qd 12</td><td>João Silva</td><td>Festas</td><td>Alvará</td></tr>
                    <tr><td>05/08</td><td>Qd 08</td><td>Maria O.</td><td>Reunião</td><td>Pauta</td></tr>
                `;
                document.getElementById('cards-list').innerHTML = `
                    <tr><td>30</td><td>03/07</td></tr>
                    <tr><td>34</td><td>08/07</td></tr>
                    <tr><td>18</td><td>28/07</td></tr>
                `;
            }, 1000);
        }

        // ------------------ AÇÃO DOS BOTÕES ------------------
        function abrirModule(modulo) {
            alert(`Você clicou em: ${modulo}\n\nAqui entra o link para o Front-end do Módulo de ${modulo}.`);
            /* Exemplo de integração futura com a sua função 'abrirPopup()' do Apps Script:
               if(modulo === 'comprovante') { window.open(URL_API + '?action=abrirPopup&tipo=comprovante'); }
            */
        }
    </script>
</body>
</html>
